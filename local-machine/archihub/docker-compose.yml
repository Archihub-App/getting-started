# ArchiHUB on a single machine.
#
# Values that depend on the installation come from `.env` (see `.env.bak` for
# the full list). Values fixed by this file itself - service host names,
# ports inside the compose network, paths inside the image - are written here
# directly rather than read from `.env`, so they cannot drift apart.
#
# A variable in `.env` reaches a container ONLY if it is named below: compose
# uses `.env` for ${VAR} substitution in this file, it injects nothing by itself.

# ----------- ENVIRONMENT VARIABLES -----------
x-archihub_env_variables: &archihub_env_variables
  # Secrets - required, the backend refuses to start without them.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  FERNET_KEY: ${FERNET_KEY}
  # Runtime
  FASTAPI_ENV: ${FASTAPI_ENV:-PROD}
  FASTAPI_RUN_PORT: ${BACKEND_PORT}
  UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
  # Public address of the frontend, used to build password-reset links.
  REDIRECT_URL: ${REDIRECT_URL}
  # MongoDB. The database is named after the instance.
  MONGO_IP_SERVER: archihub_mongodb_server_01
  MONGO_PORT: '27017'
  MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
  MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
  MONGO_DATABASE: archihub-${ENVIRONMENT_NAME}
  # Redis: Celery broker and application cache.
  CELERY_BROKER_URL: redis://redis
  CELERY_BROKER_HOST: redis
  # Elasticsearch. The index prefix is named after the instance.
  ELASTIC_DOMAIN: http://archihub_elasticsearch
  ELASTIC_PORT: '9200'
  ELASTIC_USER: ${ELASTIC_USER:-elastic}
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
  ELASTIC_INDEX_PREFIX: archihub-${ENVIRONMENT_NAME}
  # Storage roots inside the image; the host directories are mounted onto them.
  USER_FILES_PATH: /app/userfiles
  WEB_FILES_PATH: /app/webfiles
  ORIGINAL_FILES_PATH: /app/uploads
  TEMPORAL_FILES_PATH: /app/temporal
  # Node-to-node cache invalidation: a worker that finishes a derivative asks
  # the backend to flush its cache, presenting NODE_TOKEN as a Bearer key.
  MASTER_HOST: http://archihub_backend:${BACKEND_PORT}
  NODE_TOKEN: ${NODE_TOKEN}
  # Plugin settings are NOT listed here: each plugin reads its own
  # `backend/archihub/plugins/<plugin>/.env`, mounted below. A variable set
  # here - even to an empty value - would take precedence over that file.
  PLUGIN_CONFIG_PATH: /app/plugin_config

x-worker_env_variables: &worker_env_variables
  <<: *archihub_env_variables
  CELERY_WORKER: 'true'
  CELERYD_CONCURRENCY: ${CELERYD_CONCURRENCY:-1}

x-archihub_volumes: &archihub_volumes
  # Plugin settings. The image leaves out each plugin's `.env` (it holds
  # credentials); PLUGIN_CONFIG_PATH makes plugins read them from here. Only the
  # `.env` files are read from this mount - the plugin code that runs is the
  # image's, so changing a plugin still requires a rebuild.
  - ./backend/archihub/plugins:/app/plugin_config:ro
  - ${USERFILES_PATH}:/app/userfiles
  - ${WEBFILE_PATH}:/app/webfiles
  - ${UPLOAD_PATH}:/app/uploads
  - ${TEMPORAL_PATH}:/app/temporal

services:

# ---------------------- MONGO DATABASE SERVICE ----------------------
  archihub_mongodb_server_01:
    image: mongo:7.0.21
    restart: always
    # Published on the loopback interface only: the backend reaches it over the
    # compose network, this is for administration from the host.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      # Read only when the data directory is empty (first start).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: archihub-${ENVIRONMENT_NAME}
    volumes:
      - ${DATA_PATH}/mongodb:/data/db
    networks:
      - archihub_mongo_network

# ------------------------- ARCHIHUB BACKEND -------------------------
  archihub_backend:
    build:
      context: ./backend
    restart: always
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    environment:
      <<: *archihub_env_variables
    volumes: *archihub_volumes
    depends_on:
      - archihub_mongodb_server_01
      - redis
      - archihub_elasticsearch
    command: ["/bin/bash", "/app/start.sh"]
    networks:
      - default
      - archihub_mongo_network
      - archihub_elastic_network
    stop_signal: SIGTERM

# ----------------------- CELERY WORKER SERVICE -----------------------
# Consumes the default queue, where the core pipeline runs: file processing,
# indexing and most plugin jobs. `start_celery.sh` starts and supervises the
# worker itself.
  celery_worker:
    build:
      context: ./backend
    restart: always
    environment:
      <<: *worker_env_variables
    volumes: *archihub_volumes
    depends_on:
      - archihub_backend
      - redis
      - archihub_elasticsearch
    command: ["/bin/bash", "/app/start_celery.sh"]
    networks:
      - archihub_mongo_network
      - archihub_elastic_network
    stop_signal: SIGTERM

# ----------------------- CELERY BEAT SERVICE -----------------------
# The scheduler for periodic tasks (scheduleSystemTasks). Enable it when
# scheduled tasks are configured. Run exactly ONE across the whole
# installation, or every scheduled task runs once per scheduler.

  # celery_beat:
  #   build:
  #     context: ./backend
  #   restart: always
  #   environment:
  #     <<: *worker_env_variables
  #     CELERY_RUN_MODE: beat
  #   volumes: *archihub_volumes
  #   depends_on:
  #     - redis
  #     - archihub_elasticsearch
  #   command: ["/bin/bash", "/app/start_celery.sh"]
  #   networks:
  #     - archihub_mongo_network
  #     - archihub_elastic_network
  #   stop_signal: SIGTERM

# ------------------ CELERY WORKER FOR NAMED QUEUES ------------------
# Some plugins send their jobs to a named queue (transcribeWhisperX: high,
# atlasOCR: medium), which the default worker does not consume. Enable this
# worker when one of them is active.

  # celery_worker_queues:
  #   build:
  #     context: ./backend
  #   restart: always
  #   environment:
  #     <<: *worker_env_variables
  #     CELERY_QUEUES: high,medium,low
  #     CELERY_EXTRA_ARGS: -P solo
  #   volumes: *archihub_volumes
  #   depends_on:
  #     - archihub_backend
  #     - redis
  #     - archihub_elasticsearch
  #   command: ["/bin/bash", "/app/start_celery.sh"]
  #   networks:
  #     - archihub_mongo_network
  #     - archihub_elastic_network
  #   stop_signal: SIGTERM

# --------------- CELERY WORKER FOR NAMED QUEUES, WITH GPU ---------------
# The same worker as above with an NVIDIA GPU. Enable one of the two, not both.

  # celery_worker_queues:
  #   build:
  #     context: ./backend
  #   restart: always
  #   environment:
  #     <<: *worker_env_variables
  #     CELERY_QUEUES: high,medium,low
  #     CELERY_EXTRA_ARGS: -P solo
  #     CUDA_VISIBLE_DEVICES: 0 # The GPU device to use
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   volumes: *archihub_volumes
  #   depends_on:
  #     archihub_backend:
  #       condition: service_started
  #     redis:
  #       condition: service_started
  #     archihub_elasticsearch:
  #       condition: service_healthy
  #   command: ["/bin/bash", "/app/start_celery.sh"]
  #   networks:
  #     - archihub_mongo_network
  #     - archihub_elastic_network
  #   stop_signal: SIGTERM

# ---------------------- ELASTICSEARCH SERVICE ----------------------
  archihub_elasticsearch:
    image: elasticsearch:7.17.28
    restart: always
    # Loopback only, for the same reason as MongoDB.
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      "discovery.type": single-node
      "cluster.name": elasticsearch
      "node.name": archihub_elasticsearch
      "xpack.license.self_generated.type": basic
      "ES_JAVA_OPTS": "-Xms512m -Xmx512m"
      "ELASTIC_PASSWORD": ${ELASTIC_PASSWORD}
    volumes:
      - ${DATA_PATH}/elastic:/usr/share/elasticsearch/data
    networks:
      - archihub_elastic_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

# ----------------------- OLLAMA SERVICE -----------------------
# Optional local models. Once running, add it in the AI services screen as an
# `ollama` provider at http://archihub_ollama:11434, and pull models with:
#   docker exec -it archihub-archihub_ollama-1 ollama pull <model_name>

  # archihub_ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ../../ollama:/root/.ollama
  #   environment:
  #     CUDA_VISIBLE_DEVICES: 0 # Remove if not using a GPU
  #   networks:
  #     - archihub_mongo_network
  #     - archihub_elastic_network
  #   command: serve
  #   # Remove the deploy section if not using a GPU
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

# ---------------- FRONTEND SERVICE (NEXT.JS NODE PROCESS) ----------------
# Runs the standalone build copied into ./frontend/build. Reached only through
# the nginx service below. Pages rendered on the server reach the backend by its
# service name; the browser uses URL_API from config.json.
  archihub_frontend_node:
    build:
      context: ./frontend
      dockerfile: Dockerfile.node
    restart: always
    environment:
      URL_API_INTERNAL: http://archihub_backend:${BACKEND_PORT}
    expose:
      - "3000"

# ---------------- FRONTEND SERVICE (NGINX REVERSE PROXY) ----------------
  archihub_frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - archihub_backend
      - archihub_frontend_node

# ---------------------- REDIS SERVICE ----------------------
  redis:
    image: redis:6-alpine
    restart: always
    # Loopback only, for the same reason as MongoDB.
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - archihub_mongo_network
      - archihub_elastic_network

# ---------------------- NETWORKS ----------------------
networks:
  archihub_mongo_network:
    name: archihub_mongo_network
  archihub_elastic_network:
    name: archihub_elastic_network
